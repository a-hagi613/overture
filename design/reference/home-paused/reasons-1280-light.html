<div id="dc-root"><div class="sc-host" data-sc-name="home-paused-reasons"><div data-dc-tpl="3" class="ov" style="width: 1280px; padding: 40px 48px; box-sizing: border-box;"><p data-dc-tpl="4" class="serif" style="font-size: 15px; font-style: italic; color: var(--mut);">Home, paused · all seven reasons</p><h1 data-dc-tpl="5" class="serif" style="font-size: 40px; line-height: 1.1; margin: 4px 0px 24px;">Why sending <span data-dc-tpl="6" class="it">stopped</span></h1><figure data-dc-tpl="7" style="margin: 0px 0px 28px;"><figcaption data-dc-tpl="8" class="mono" style="font-size: 12px; color: var(--mut); margin-bottom: 8px;">01 · reason = user</figcaption><section data-dc-tpl="9" aria-label="Pause banner, user" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 16px 20px; border-radius: 8px; background: var(--card); border: 1px solid var(--line2);"><div data-dc-tpl="10" style="display: flex; align-items: center; gap: 14px; flex: 1 1 360px; min-width: 0px;"><span data-dc-tpl="11" aria-hidden="true" style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--well); color: var(--ink); display: flex; align-items: center; justify-content: center;"><svg data-dc-tpl="12" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect data-dc-tpl="13" x="6" y="5" width="4" height="14" rx="1"></rect><rect data-dc-tpl="14" x="14" y="5" width="4" height="14" rx="1"></rect></svg></span><p data-dc-tpl="15" style="font-size: 14px; line-height: 1.45; color: var(--ink);"><b data-dc-tpl="16" style="font-weight: 700;">Paused by you.</b> Nothing new is sent until you resume.</p></div><button data-dc-tpl="17" type="button" class="btn" style="flex: 0 0 auto;">Resume</button></section></figure><figure data-dc-tpl="18" style="margin: 0px 0px 28px;"><figcaption data-dc-tpl="19" class="mono" style="font-size: 12px; color: var(--mut); margin-bottom: 8px;">02 · reason = onboarding</figcaption><sectio "14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect data-dc-tpl="35" x="6" y="5" width="4" height="14" rx="1"></rect><rect data-dc-tpl="36" x="14" y="5" width="4" height="14" rx="1"></rect></svg></span><p data-dc-tpl="37" style="font-size: 14px; line-height: 1.45; color: var(--ink);"><b data-dc-tpl="38" style="font-weight: 700;">No resume on file.</b> Overture sends only the exact file you upload, so it needs one first.</p></div><button data-dc-tpl="39" type="button" class="btn" style="flex: 0 0 auto;">Upload resume</button></section></figure><figure data-dc-tpl="40" style="margin: 0px 0px 28px;"><figcaption data-dc-tpl="41" class="mono" style="font-size: 12px; color: var(--mut); margin-bottom: 8px;">04 · reason = plan_ended</figcaption><section data-dc-tpl="42" aria-label="Pause banner, plan_ended" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 16px 20px; border-radius: 8px; background: var(--needbg); border: 1px solid var(--need);"><div data-dc-tpl="43" style="display: flex; align-items: center; gap: 14px; flex: 1 1 360px; min-width: 0px;"><span data-dc-tpl="44" aria-hidden="true" style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--card); color: var(--need); display: flex; align-items: center; justify-content: center;"><svg data-dc-tpl="45" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect data-dc-tpl="46" x="6" y="5" width="4" height="14" rx="1"></rect><rect data-dc-tpl="47" x="14" y="5" width="4" height="14" rx="1"></rect></svg></span><p data-dc-tpl="48" style="font-size: 14px; line-height: 1.45; color: var(--ink);"><b data-dc-tpl="49" style="font-weight: 700;">Your plan has ended.</b> Sending stopped when it ran out. Your queue and history are kept.</p></div><button data-dc-tpl="50" type="button" class="btn" style="flex: 0 0 auto;">Choose a plan</button></section></figure><figure data-dc-tpl="51" style="margin: 0px 0px 28px;">< -radius: 50%; background: var(--card); color: var(--need); display: flex; align-items: center; justify-content: center;"><svg data-dc-tpl="67" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect data-dc-tpl="68" x="6" y="5" width="4" height="14" rx="1"></rect><rect data-dc-tpl="69" x="14" y="5" width="4" height="14" rx="1"></rect></svg></span><p data-dc-tpl="70" style="font-size: 14px; line-height: 1.45; color: var(--ink);"><b data-dc-tpl="71" style="font-weight: 700;">Your account is under review.</b> Sending is paused while we check it. Support can tell you more.</p></div><button data-dc-tpl="72" type="button" class="btn" style="flex: 0 0 auto;">Contact support</button></section></figure><figure data-dc-tpl="73" style="margin: 0px 0px 28px;"><figcaption data-dc-tpl="74" class="mono" style="font-size: 12px; color: var(--mut); margin-bottom: 8px;">07 · reason = no_mailbox</figcaption><section data-dc-tpl="75" aria-label="Pause banner, no_mailbox" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; padding: 16px 20px; border-radius: 8px; background: var(--needbg); border: 1px solid var(--need);"><div data-dc-tpl="76" style="display: flex; align-items: center; gap: 14px; flex: 1 1 360px; min-width: 0px;"><span data-dc-tpl="77" aria-hidden="true" style="flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; background: var(--card); color: var(--need); display: flex; align-items: center; justify-content: center;"><svg data-dc-tpl="78" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect data-dc-tpl="79" x="6" y="5" width="4" height="14" rx="1"></rect><rect data-dc-tpl="80" x="14" y="5" width="4" height="14" rx="1"></rect></svg></span><p data-dc-tpl="81" style="font-size: 14px; line-height: 1.45; color: var(--ink);"><b data-dc-tpl="82" style="font-weight: 700;">Forwarding isn't set up.</b> We need your ATS mail forwarded to see replies and confirmations.</p></div><button data-dc-tpl="83" type="button" class="btn" style="flex: 0 0 auto;">Set up forwarding</button></section></figure></div></div></div>
