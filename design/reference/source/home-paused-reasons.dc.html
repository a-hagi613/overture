<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overture Home, pause reasons</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
.ov{--bg:#F3EEE4;--bg2:#ECE6DA;--card:#FBF8F2;--well:#E9E3D8;--ink:#151311;--mut:#5E5850;--line:rgba(21,19,17,.14);--line2:rgba(21,19,17,.28);--hl:rgba(255,255,255,.55);--acc:#D2561F;--acct:#A9431A;--accbg:rgba(210,86,31,.10);--need:#8E3A2C;--needbg:#EFD9D3;--ok:#3F6B52;--okbg:#DDE7DE;--btn:var(--ink);--btnink:#FBF8F2;--btnh:#3A3631;--sh:0 1px 0 rgba(21,19,17,.10),0 12px 24px -18px rgba(21,19,17,.38);--shc:rgba(21,19,17,.5);--bloom:rgba(255,255,255,.5);--emph:var(--ink);--eyebrow:var(--mut);--rank:var(--need);--nbg:var(--ink);--nink:var(--bg);--inbg:var(--well);--inink:var(--ink);--meter:var(--ink);--focus:var(--ink);--sel:var(--ink);--score:var(--ink);--score2:var(--mut);--done:var(--ink);--donering:var(--well)}
.ov.dark{--bg:#191714;--bg2:#1E1C19;--card:#221F1C;--well:#2A2723;--ink:#F2EDE4;--mut:#ADA69B;--line:rgba(242,237,228,.14);--line2:rgba(242,237,228,.26);--hl:rgba(255,255,255,.04);--acc:#F0743A;--acct:#F37D44;--accbg:rgba(240,116,58,.16);--need:#E58A78;--needbg:#40261F;--ok:#8DBFA2;--okbg:#25352B;--btn:var(--ink);--btnink:#191714;--btnh:#FFFBF2;--sh:0 1px 0 rgba(0,0,0,.4),0 12px 26px -20px rgba(0,0,0,.8);--shc:rgba(0,0,0,.7);--bloom:rgba(255,255,255,.04);--emph:var(--ink);--eyebrow:var(--mut);--rank:var(--need);--nbg:var(--ink);--nink:var(--bg);--inbg:var(--well);--inink:var(--ink);--meter:var(--ink);--focus:var(--ink);--sel:var(--ink);--score:var(--ink);--score2:var(--mut);--done:var(--ink);--donering:var(--well)}
.ov{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.ov *{box-sizing:border-box}
.ov a{color:inherit;text-decoration:none}
.ov h1,.ov h2,.ov h3,.ov p{margin:0}
.ov :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.serif{font-family:'Instrument Serif','Newsreader',Georgia,serif;font-weight:400;letter-spacing:-.005em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:400}
.num{font-variant-numeric:tabular-nums}
.it{font-style:italic;color:var(--emph)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:6px;background:var(--btn);color:var(--btnink)!important;font:600 13.5px 'Plus Jakarta Sans',sans-serif;border:1px solid var(--btn);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.btn:hover{background:var(--btnh);border-color:var(--btnh)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:6px;background:var(--card);color:var(--ink);font:600 13.5px 'Plus Jakarta Sans',sans-serif;border:1px solid var(--line2);cursor:pointer}
.btn2:hover{background:var(--well)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--sh)}
.rule{border:0;border-top:1px solid var(--line);box-shadow:0 1px 0 var(--hl);margin:0}
.eyebrow{font:600 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--eyebrow)}
.fig{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:14px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:600 11.5px 'Plus Jakarta Sans',sans-serif}
.ni{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 12px;border-radius:6px;border:1px solid transparent;color:var(--mut);font-weight:500;font-size:14px}
.ni:hover{background:var(--well);color:var(--ink)}
.ni.on{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--sh);position:relative}
.ni.on::before{content:'';position:absolute;left:-1px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--acc)}
.sub{display:flex;align-items:center;min-height:34px;padding:0 12px;font-size:13.5px;color:var(--mut);border-radius:6px}
.sub:hover{color:var(--ink);background:var(--well)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.seg{min-height:34px;padding:0 15px;border:0;background:transparent;color:var(--mut);font:600 12.5px 'Plus Jakarta Sans',sans-serif;border-radius:5px;cursor:pointer}
.seg:hover{color:var(--ink)}
.seg.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.ibtn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer;position:relative}
.ibtn:hover{background:var(--well)}
.field{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--card);flex:1 1 260px;max-width:380px;min-width:200px}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 13.5px 'Plus Jakarta Sans',sans-serif;color:var(--ink)}
.field input::placeholder{color:var(--mut);opacity:1}
.field:focus-within{outline:2px solid var(--focus);outline-offset:2px}
kbd{font:500 11.5px 'Plus Jakarta Sans',sans-serif;color:var(--mut);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;background:var(--bg)}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.tx-d{display:none}
.dark .tx-l{display:none}
.dark .tx-d{display:block}
.ic-sun{display:none}.dark .ic-sun{display:block}.dark .ic-moon{display:none}
.tb{flex:1;min-width:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:600;position:relative}
.tb.on{color:var(--ink)}
.tb.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--acc);border-radius:0 0 2px 2px}
.tbb{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.shell{position:relative;z-index:1;display:flex;flex-wrap:wrap;align-items:stretch}
.nt{white-space:nowrap}
.usage-mini{display:none}
.avh{display:none}
.tabbar{display:none}
.ibtn.tgl{flex:none}
.chh{height:200px}
.chh svg{height:100%!important}
@media (max-width:1279px) and (min-width:768px){
.sb{flex:0 0 76px!important;padding:20px 10px 18px!important;align-items:center}
.sb .wm,.sb .cb,.sb .chev,.sb .subm,.sb .usage,.sb .wn{display:none!important}
.sb .nt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sb .brand{justify-content:center!important;padding:0!important}
.sb hr{width:36px}
.sb nav{width:100%}
.sb .ni{justify-content:center;padding:0;position:relative;min-height:44px}
.sb .badge{position:absolute;top:2px;right:4px;margin:0;min-width:16px;height:16px;font-size:10px;padding:0 4px}
.sb .usage-mini{display:flex;flex-direction:column;align-items:center;gap:4px}
.sb .who{justify-content:center;padding:6px 0 0!important}
}
@media (max-width:1099px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-width:767px){
.sb{display:none!important}
.mn{padding:18px 16px 28px!important}
.gh{font-size:32px!important}
.ibtn{width:44px;height:44px}
.avh{display:inline-flex}
.btn,.btn2,.btng,.field,.inp,.fld select{min-height:44px}
.field{min-width:0;max-width:100%}
kbd{display:none}
.kpis{gap:12px!important}
.kpis article{padding:14px 14px 12px!important}
.kv{font-size:40px!important}
.mn section.card{padding-left:16px!important;padding-right:16px!important}
.ny-f{margin-left:-16px!important;margin-right:-16px!important;padding:14px 16px!important}
.tabbar{display:flex;position:sticky;bottom:0;z-index:5;height:64px;background:var(--bg2);border-top:1px solid var(--line);box-shadow:0 -1px 0 var(--hl)}
}
@media (min-width:1700px){
.sb{flex-basis:300px!important}
.mn{padding:32px 64px 52px!important}
.kpis{gap:24px!important}
.kv{font-size:66px!important}
.chh{height:270px}
}
@media (min-width:768px){.shell{min-height:1140px}}
@media (min-width:1700px){.shell{min-height:1240px}}
</style>
</helmet>
<div class="ov" style="width:1280px;padding:40px 48px;box-sizing:border-box">
<p class="serif" style="font-size:15px;font-style:italic;color:var(--mut)">Home, paused · all seven reasons</p>
<h1 class="serif" style="font-size:40px;line-height:1.1;margin:4px 0 24px">Why sending <span class="it">stopped</span></h1>
<figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">01 · reason = user</figcaption>
<section aria-label="Pause banner, user" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--card);border:1px solid var(--line2)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--well);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Paused by you.</b> Nothing new is sent until you resume.</p>
</div>
<button type="button" class="btn" style="flex:none">Resume</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">02 · reason = onboarding</figcaption>
<section aria-label="Pause banner, onboarding" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Setup isn't finished.</b> Sending starts once your facts, forwarding and consent are in.</p>
</div>
<button type="button" class="btn" style="flex:none">Finish setup</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">03 · reason = no_resume</figcaption>
<section aria-label="Pause banner, no_resume" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">No resume on file.</b> Overture sends only the exact file you upload, so it needs one first.</p>
</div>
<button type="button" class="btn" style="flex:none">Upload resume</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">04 · reason = plan_ended</figcaption>
<section aria-label="Pause banner, plan_ended" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Your plan has ended.</b> Sending stopped when it ran out. Your queue and history are kept.</p>
</div>
<button type="button" class="btn" style="flex:none">Choose a plan</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">05 · reason = payment_failed</figcaption>
<section aria-label="Pause banner, payment_failed" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Payment didn't go through.</b> Sending stays paused until the card is updated.</p>
</div>
<button type="button" class="btn" style="flex:none">Update payment</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">06 · reason = suspended</figcaption>
<section aria-label="Pause banner, suspended" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Your account is under review.</b> Sending is paused while we check it. Support can tell you more.</p>
</div>
<button type="button" class="btn" style="flex:none">Contact support</button>
</section></figure><figure style="margin:0 0 28px"><figcaption class="mono" style="font-size:12px;color:var(--mut);margin-bottom:8px">07 · reason = no_mailbox</figcaption>
<section aria-label="Pause banner, no_mailbox" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 20px;padding:16px 20px;border-radius:8px;background:var(--needbg);border:1px solid var(--need)">
<div style="display:flex;align-items:center;gap:14px;flex:1 1 360px;min-width:0">
<span aria-hidden="true" style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--need);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></span>
<p style="font-size:14px;line-height:1.45;color:var(--ink)"><b style="font-weight:700">Forwarding isn't set up.</b> We need your ATS mail forwarded to see replies and confirmations.</p>
</div>
<button type="button" class="btn" style="flex:none">Set up forwarding</button>
</section></figure>
</div>
