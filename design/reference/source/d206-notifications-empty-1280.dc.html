<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overture notifications empty, 1280</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%">
<dc-import name="w5-notifications" dark="{{dark}}" state="{{state}}" grain="{{grain}}" hint-size="100%,1140px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.5,"min":0,"max":1,"step":0.05,"unit":""},"state":{"editor":"enum","options":["unread","empty"],"default":"empty"},"$preview":{"width":1280,"height":1140}}'>
class Component extends DCLogic {
renderVals() {
return { dark: this.props.dark ?? false, grain: this.props.grain ?? 0.5, state: this.props.state ?? 'empty' };
}
}
</script>
</body>
</html>
