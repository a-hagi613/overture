<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"grain":{"editor":"range","default":0.5,"min":0,"max":1,"step":0.05,"unit":""},"$preview":{"width":1280,"height":1120}}'>
class Component extends DCLogic {
  componentDidUpdate(prev) {
    if (prev && prev.dark !== this.props.dark) { this.setState({ dark: !!this.props.dark }); }
  }
  renderVals() {
    const dark = (this.state && typeof this.state.dark === 'boolean') ? this.state.dark : !!this.props.dark;
    const raw = this.props.grain;
    const g = Math.max(0, Math.min(1, typeof raw === 'number' ? raw : 0.5));
    const light = { cls: 'ov', grainOpacity: +(g * 0.24).toFixed(3) };
    const night = { cls: 'ov dark', grainOpacity: +(g * 0.15).toFixed(3) };
    return {
      t: Object.assign({}, dark ? night : light, { toggleLabel: dark ? 'Switch to light mode' : 'Switch to dark mode' }),
      toggle: () => this.setState({ dark: !dark })
    };
  }
}
