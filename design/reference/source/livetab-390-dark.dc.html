<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overture Live Tab at 390, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0;background:#12110F}</style>
</helmet>
<div style="width: 100%">
<dc-import name="w5-livetab" dark="{{dark}}" grain="{{grain}}" phase="{{phase}}" hint-size="100%,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"grain":{"editor":"range","default":0.5,"min":0,"max":1,"step":0.05,"unit":""},"phase":{"editor":"enum","options":["live","checking","connecting","solved","expired"],"default":"live"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { dark: this.props.dark ?? true, grain: this.props.grain ?? 0.5, phase: this.props.phase ?? 'live' };
}
}
</script>
</body>
</html>
