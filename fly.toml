app = "overture-web"
primary_region = "yyz"

# Fly sends SIGTERM and waits kill_timeout for the machine to stop. The server drains for KILL_TIMEOUT_MS (240 s),
# then Litestream (the container's main process, whose -exec child is the Bun server) gets the rest of the window
# for its final WAL sync and close, bounded by shutdown-timeout in litestream.yml.
kill_signal = "SIGTERM"
kill_timeout = 300

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
APP_ORIGIN = "https://tryoverture.com"
PORT = "3000"
DATABASE_PATH = "/data/app.sqlite"
CATALOG_DATABASE_PATH = "/data/catalog.sqlite"
OBJECT_STORE_ROOT = "/data/objects"
LITESTREAM_CONFIG_PATH = "/etc/litestream.yml"
# Production stays invite-only until M3 public sign-up ships: the owner,
# existing and invited users, and the demo account may sign in; anyone else is
# refused.
PUBLIC_SIGNUP_ENABLED = "false"
DEMO_LOGIN_ENABLED = "true"
# Cloudflare Email Sending is onboarded on tryoverture.com, so the deploy guard
# and the daily `mail.sending` live check verify the sending domain actively
# instead of staying gated.
REQUIRE_EMAIL_SENDING = "true"
# The private Prometheus scrape for Fly's built-in Grafana (fly-metrics.net).
# It binds IPv6 `::` on 9091 and is never part of [http_service].
METRICS_ENABLED = "true"
METRICS_PORT = "9091"
METRICS_HOST = "::"
# Pulls route through the Cloudflare Worker because freehire's edge challenges Fly's egress.
FREEHIRE_BASE_URL = "https://overture-freehire-proxy.abdullahi-hagi98.workers.dev"

[metrics]
port = 9091
path = "/metrics"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0
processes = ["app"]

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "5s"
method = "get"
path = "/api/health"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"

[[mounts]]
source = "data"
destination = "/data"
initial_size = "10gb"
