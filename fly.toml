app = "overture-web"
primary_region = "yyz"

# Fly waits this long for the machine to stop. Litestream is the container's main
# process and gives the Bun server (its `-exec` child) 30 s before SIGKILL, so the
# server's own budget is KILL_TIMEOUT_MS (20 s); this value only has to be larger.
kill_timeout = 300

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
APP_ORIGIN = "https://tryoverture.com"
PORT = "3000"
DATABASE_PATH = "/data/app.sqlite"
CATALOG_DATABASE_PATH = "/data/catalog.sqlite"
OBJECT_STORE_ROOT = "/data/objects"
LITESTREAM_CONFIG_PATH = "/etc/litestream.yml"
DEMO_LOGIN_ENABLED = "true"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
interval = "30s"
timeout = "10s"
grace_period = "60s"
method = "get"
path = "/api/health"

[[vm]]
size = "shared-cpu-2x"
memory = "2gb"

[[mounts]]
source = "data"
destination = "/data"
initial_size = "10gb"
