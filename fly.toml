app = "overture-web"
primary_region = "yyz"

kill_timeout = 300

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
DATABASE_PATH = "/data/app.sqlite"
LITESTREAM_CONFIG_PATH = "/etc/litestream.yml"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
interval = "30s"
timeout = "10s"
grace_period = "60s"
method = "get"
path = "/api/health"

[[vm]]
size = "shared-cpu-2x"
memory = "2gb"

[[mounts]]
source = "data"
destination = "/data"
initial_size = "10gb"
