<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Senior Product Designer - Gated Co</title>
  </head>
  <body>
    <div class="wrapper">
      <h1>Senior Product Designer</h1>
      <aside class="sign-in-banner">
        <p>Sign in to autofill your application</p>
        <form action="/candidate/session" method="post">
          <label>Email <input type="email" name="signin_email" /></label>
          <label>Password <input type="password" name="signin_password" /></label>
          <button type="submit">Sign in</button>
        </form>
        <a href="https://www.linkedin.com/jobs/apply">Apply with LinkedIn</a>
      </aside>
      <section class="section-wrapper page-full-width">
        <form id="application-form" enctype="multipart/form-data" method="POST">
          <div class="section page-centered application-form">
            <h4>Submit your application</h4>
            <ul>
              <li class="application-question resume">
                <label>
                  <div class="application-label">Resume/CV <span class="required">✱</span></div>
                  <div class="application-field">
                    <input class="application-file-input" type="file" name="resume" />
                  </div>
                </label>
              </li>
              <li class="application-question">
                <label>
                  <div class="application-label">Full name<span class="required">✱</span></div>
                  <div class="application-field">
                    <input type="text" name="name" required="" value="" />
                  </div>
                </label>
              </li>
              <li class="application-question">
                <label>
                  <div class="application-label">Email<span class="required">✱</span></div>
                  <div class="application-field">
                    <input type="email" name="email" required="" value="" />
                  </div>
                </label>
              </li>
              <li class="application-question">
                <label>
                  <div class="application-label">Phone <span class="required">✱</span></div>
                  <div class="application-field">
                    <input type="text" name="phone" required="" value="" />
                  </div>
                </label>
              </li>
              <li class="application-question">
                <label>
                  <div class="application-label">Current location</div>
                  <div class="application-field">
                    <input type="text" name="location" value="" />
                  </div>
                </label>
              </li>
              <li class="application-question">
                <label>
                  <div class="application-label">LinkedIn URL</div>
                  <div class="application-field">
                    <input type="text" name="urls[LinkedIn]" value="" />
                  </div>
                </label>
              </li>
            </ul>
            <button type="submit" class="postings-btn">Submit application</button>
          </div>
        </form>
      </section>
    </div>
  </body>
</html>
