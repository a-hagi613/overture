# The app drains on SIGTERM for KILL_TIMEOUT_MS (240 s) and exits 0; Litestream forwards that signal to its
# -exec child, and this ceiling bounds the whole shutdown, so 280 s covers the drain, the telemetry flush and the
# SQLite close, plus a final WAL sync to R2, all inside Fly's 300 s kill_timeout.
shutdown-timeout: 280s
snapshot:
  interval: 24h
  retention: 168h
retention:
  enabled: true
# The L0 retention monitor's only job is to delete compacted level-0 files after l0-retention (5m).
# Every tick lists the replica twice, so the 15s default is ~11.5k Class A operations a day for one
# database (#281). Five minutes sweeps those files within 5 extra minutes and leaves the 30-day
# restore untouched: that comes from snapshot.retention above, not from L0 files.
l0-retention-check-interval: 5m
# Only the application database is replicated. /data/catalog.sqlite holds the public job catalog, which every feed
# sweep can rebuild, and streaming 340k+ rows to R2 every second would cost far more than it protects (ADR 0036).
# Never add it here.
dbs:
  - path: /data/app.sqlite
    # The app opens app.sqlite with PRAGMA wal_autocheckpoint = 0, so SQLite never checkpoints on a writer's own
    # commit and Litestream is the only checkpoint owner. These explicit defaults keep the WAL bounded: a PASSIVE
    # checkpoint every minute (time-based) and one at ~1000 pages (~4 MB), plus the blocking TRUNCATE backstop at
    # ~121k pages (~500 MB). journal_size_limit (64 MB) in the app caps the WAL file when SQLite resets the log at a
    # checkpoint.
    checkpoint-interval: 1m
    min-checkpoint-page-count: 1000
    replicas:
      - type: s3
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        bucket: ${R2_BUCKET_BACKUPS}
        path: app.sqlite
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        sync-interval: 1s
