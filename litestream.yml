snapshot:
  interval: 24h
  retention: 720h
retention:
  enabled: true
dbs:
  - path: /data/app.sqlite
    replicas:
      - type: s3
        endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        bucket: ${R2_BUCKET_BACKUPS}
        path: app.sqlite
        access-key-id: ${R2_ACCESS_KEY_ID}
        secret-access-key: ${R2_SECRET_ACCESS_KEY}
        sync-interval: 1s
