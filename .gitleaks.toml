# gitleaks configuration for CI and local scans (see docs/adr/0023-lint-rule-set.md, "Secret and personal-file checks").
#
# Start from gitleaks' default rules and allow only what is listed below. Every allowlist entry names
# the exact reason it exists; widen an entry only with the same kind of reason.

title = "Overture secret scan"

[extend]
useDefault = true

# Recorded third-party Greenhouse page HTML. The pages embed those sites' own public browser keys
# (Google Picker, Dropbox chooser, reCAPTCHA site key). They are not ours and they are not secrets.
[[allowlists]]
description = "Recorded third-party Greenhouse pages embed their owners' public browser keys"
paths = ['''^test/e2e/fixtures/forms/''']

# The deterministic test keys in the e2e auth fixture: a master key derived from a fixed string, and the
# Cloudflare Turnstile dummy site and secret keys that always pass. Matched by exact path AND by a line
# pattern, so the rest of the file stays scanned.
[[allowlists]]
description = "Deterministic e2e test keys (fixed master key, Turnstile dummy keys) in the auth fixture"
condition = "AND"
paths = ['''^test/e2e/auth\.fixture\.ts$''']
regexTarget = "line"
regexes = [
  '''masterKey\b''',
  '''turnstile(SiteKey|Secret|PassToken)\b''',
  '''1x0{20}[A-Za-z0-9]{2}''',
]

# A false positive: the variable named localPart in the inbound mail test trips the generic API key rule.
# Only that line pattern is allowed, and only in that file.
[[allowlists]]
description = "False positive: the localPart variable in the inbound mail test"
condition = "AND"
paths = ['''^test/e2e/inbound-mail\.test\.ts$''']
regexTarget = "line"
regexes = ['''\blocalPart\b''']
