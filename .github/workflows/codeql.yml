name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL (github/codeql-action v4.39.4 @ 1bd86f2)
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: javascript-typescript
      - name: Analyze (github/codeql-action v4.39.4 @ 1bd86f2)
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: "/language:javascript-typescript"
