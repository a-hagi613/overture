name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless FLY_API_TOKEN is set (docs/DEPLOY.md, one-time step 6)
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set yet (docs/DEPLOY.md one-time step 6); skipping deploy."
            {
              echo "### Deploy skipped"
              echo ""
              echo "The \`FLY_API_TOKEN\` repository secret is not set yet (see docs/DEPLOY.md, one-time step 6)."
              echo "Nothing was deployed. Once \`gh secret set FLY_API_TOKEN\` is done, the next"
              echo "successful CI run on \`main\` deploys as usual."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up flyctl (superfly/flyctl-actions/setup-flyctl @ master @ 98172f7)
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Refuse to deploy while a required Fly secret is missing (docs/DEPLOY.md, step 5)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUIRE_CLOUDFLARE_EMAIL_SECRETS: ${{ vars.REQUIRE_CLOUDFLARE_EMAIL_SECRETS }}
        run: |
          set -euo pipefail
          required="R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_BACKUPS R2_BUCKET_FILES OWNER_EMAIL TURNSTILE_SITE_KEY TURNSTILE_SECRET"
          if [ "${REQUIRE_CLOUDFLARE_EMAIL_SECRETS:-}" = "true" ]; then
            required="$required CLOUDFLARE_EMAIL_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID"
          fi
          present="$(flyctl secrets list -a overture-web --json | jq -r '.[].name')"
          missing=""
          for name in $required; do
            if ! grep -qx "$name" <<<"$present"; then
              missing="$missing $name"
            fi
          done
          # Either the single secret or the versioned rotation chain satisfies the app.
          if ! grep -qx "BETTER_AUTH_SECRET" <<<"$present" && ! grep -qx "BETTER_AUTH_SECRETS" <<<"$present"; then
            missing="$missing BETTER_AUTH_SECRET|BETTER_AUTH_SECRETS"
          fi
          # Any versioned master key is accepted by name; the app's boot check enforces that the chain
          # reaches MASTER_KEY_CURRENT, so a fully rotated deployment without MASTER_KEY_V1 still deploys.
          # MASTER_KEY_CURRENT is optional and defaults to 1 in the app, so it is only required once V1 is gone.
          if ! grep -qE '^MASTER_KEY_V[0-9]+$' <<<"$present"; then
            missing="$missing MASTER_KEY_V<n>"
          fi
          if ! grep -qx "MASTER_KEY_CURRENT" <<<"$present" && ! grep -qx "MASTER_KEY_V1" <<<"$present"; then
            missing="$missing MASTER_KEY_CURRENT"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Fly secrets missing on overture-web:$missing. The app refuses to boot without them; production stays on its current release."
            {
              echo "### Deploy refused"
              echo ""
              echo "These Fly secrets are not set on \`overture-web\`:$missing"
              echo ""
              echo "The server's env schema requires them, so a deploy would crash-loop. Set them with"
              echo "\`fly secrets set\` (docs/DEPLOY.md, step 5); the next successful CI run on \`main\` deploys."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Cloudflare Email Sending guard (docs/DEPLOY.md, M2-02)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUIRE_EMAIL_SENDING: ${{ vars.REQUIRE_EMAIL_SENDING }}
        run: |
          set -uo pipefail
          # A down or unresponsive machine must not hold the deploy-main concurrency group for six hours.
          status=0
          output="$(timeout 45s flyctl ssh console -a overture-web -C "bun run /app/scripts/onboard-email-sending.ts --check" 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "::warning::The email sending check did not answer within 45s (machine down or unresponsive); treating it as not ready."
          fi
          if grep -q "verdict: ready" <<<"$output"; then
            echo "Cloudflare Email Sending verified."
            exit 0
          fi
          if [ "${REQUIRE_EMAIL_SENDING:-}" = "true" ]; then
            echo "::error::Cloudflare Email Sending is not ready; refusing to deploy. Run scripts/onboard-email-sending.ts (docs/DEPLOY.md, M2-02)."
            {
              echo "### Deploy refused"
              echo ""
              echo "The sending-domain check failed, so a send to anyone but the owner would be refused."
              echo "Pay Workers Paid, then run \`bun run /app/scripts/onboard-email-sending.ts\` on \`overture-web\`"
              echo "(docs/DEPLOY.md, M2-02). Production stays on its current release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning::Cloudflare Email Sending is not ready yet; not blocking this deploy because REQUIRE_EMAIL_SENDING is not set (M2 owner setup #236)."
          {
            echo "### Cloudflare Email Sending pending"
            echo ""
            echo "The sending-domain check failed, but \`REQUIRE_EMAIL_SENDING\` is not set, so this deploy continues."
            echo "M2 owner setup #236 pays for Workers Paid and runs the onboarding script."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Fly
        if: steps.guard.outputs.skip != 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the health route in production
        if: steps.guard.outputs.skip != 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://overture-web.fly.dev/api/health | tee /tmp/health.json; then
              exit 0
            fi
            sleep 10
          done
          echo "health route never answered: $(cat /tmp/health.json || true)"
          exit 1
      - name: Show Fly status and logs after a failed deploy (docs/DEPLOY.md)
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # Diagnostics only: a failed probe must never change the job result.
          echo "::group::flyctl status -a overture-web"
          timeout 30s flyctl status -a overture-web || true
          echo "::endgroup::"
          echo "::group::flyctl logs -a overture-web (last 120 lines)"
          timeout 30s flyctl logs -a overture-web --no-tail | tail -n 120 || true
          echo "::endgroup::"
