name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless FLY_API_TOKEN is set (docs/DEPLOY.md, one-time step 6)
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set yet (docs/DEPLOY.md one-time step 6); skipping deploy."
            {
              echo "### Deploy skipped"
              echo ""
              echo "The \`FLY_API_TOKEN\` repository secret is not set yet (see docs/DEPLOY.md, one-time step 6)."
              echo "Nothing was deployed. Once \`gh secret set FLY_API_TOKEN\` is done, the next"
              echo "successful CI run on \`main\` deploys as usual."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up flyctl (superfly/flyctl-actions/setup-flyctl @ master @ 98172f7)
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Refuse to deploy while a required Fly secret is missing (docs/DEPLOY.md, step 5)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUIRE_SES_SECRETS: ${{ vars.REQUIRE_SES_SECRETS }}
        run: |
          set -euo pipefail
          required="R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_BACKUPS R2_BUCKET_FILES BETTER_AUTH_SECRET OWNER_EMAIL TURNSTILE_SITE_KEY TURNSTILE_SECRET MASTER_KEY_V1"
          if [ "${REQUIRE_SES_SECRETS:-}" = "true" ]; then
            required="$required AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION"
          fi
          present="$(flyctl secrets list -a overture-web --json | jq -r '.[].name')"
          missing=""
          for name in $required; do
            if ! grep -qx "$name" <<<"$present"; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Fly secrets missing on overture-web:$missing. The app refuses to boot without them; production stays on its current release."
            {
              echo "### Deploy refused"
              echo ""
              echo "These Fly secrets are not set on \`overture-web\`:$missing"
              echo ""
              echo "The server's env schema requires them, so a deploy would crash-loop. Set them with"
              echo "\`fly secrets set\` (docs/DEPLOY.md, step 5); the next successful CI run on \`main\` deploys."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Deploy to Fly
        if: steps.guard.outputs.skip != 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the health route in production
        if: steps.guard.outputs.skip != 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://overture-web.fly.dev/api/health | tee /tmp/health.json; then
              exit 0
            fi
            sleep 10
          done
          echo "health route never answered: $(cat /tmp/health.json || true)"
          exit 1
