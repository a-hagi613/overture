name: Deploy

# Two ways in, and both deploy `main`:
# - `workflow_run`: a human (or `gh pr merge` with a user token) merges to `main`, the push starts CI, and CI's success
#   starts this workflow.
# - `workflow_dispatch`: an auto-merge is attributed to `app/github-actions`, and GitHub starts no workflow for an event
#   caused by `GITHUB_TOKEN`, so the merge creates no CI run on `main` and the `workflow_run` trigger never fires.
#   `.github/workflows/auto-merge.yml` waits for the merge and dispatches this workflow instead. `workflow_dispatch` is
#   one of the two events `GITHUB_TOKEN` may always trigger.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      # A re-deploy of a commit that already deployed successfully (for example after a Fly incident) is deliberate.
      force:
        description: Deploy even when this commit already has a successful Deploy run
        type: boolean
        default: false

concurrency:
  # One deploy at a time, and a queued deploy is never cancelled: the two entry points above, plus several merges in one
  # window, must never run two `flyctl deploy` calls at once. A queued run starts after the previous one finishes and
  # deploys whatever `main` is then, so a burst of merges still reaches production in order.
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # `actions: read` reads this workflow's own runs for the exactly-once guard below; the deploy itself still only
    # needs `contents: read`.
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Skip when this commit already has a Deploy run, or while FLY_API_TOKEN is unset
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          # Exactly once: two entry points (a CI success and a dispatch from auto-merge) plus a superseded waiter can ask
          # for the same commit twice. The deploy-main group serializes the runs, so the second one starts after the
          # first finishes and sees it here. A failed or cancelled Deploy is retried; `-f force=true` skips this guard.
          if [ "${FORCE:-false}" != "true" ]; then
            # This run is in the list too, and it is in progress, so it must not count as its own predecessor.
            prior="$(gh run list --workflow deploy.yml --branch main --limit 30 \
              --json databaseId,headSha,status,conclusion \
              --jq '.[] | "\(.databaseId) \(.headSha) \(.status) \(.conclusion // "-")"')"
            covered=false
            while read -r id sha status conclusion; do
              if [ -z "$id" ] || [ "$id" = "$RUN_ID" ]; then
                continue
              fi
              if [ "$sha" = "$HEAD_SHA" ]; then
                if [ "$status" != "completed" ] || [ "$conclusion" = "success" ]; then
                  covered=true
                fi
              fi
            done <<< "$prior"
            if [ "$covered" = "true" ]; then
              echo "::notice::Deploy already has a queued, running or successful run for ${HEAD_SHA}; not deploying it twice."
              {
                echo "### Deploy skipped"
                echo ""
                echo "\`${HEAD_SHA}\` already has a queued, running or successful Deploy run. Run the workflow with"
                echo "\`force\` to deploy this commit again deliberately."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set yet (docs/DEPLOY.md one-time step 6); skipping deploy."
            {
              echo "### Deploy skipped"
              echo ""
              echo "The \`FLY_API_TOKEN\` repository secret is not set yet (see docs/DEPLOY.md, one-time step 6)."
              echo "Nothing was deployed. Once \`gh secret set FLY_API_TOKEN\` is done, the next"
              echo "successful CI run on \`main\` deploys as usual."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          # The CI run's commit for a `workflow_run` deploy; for a dispatched deploy there is no `workflow_run`, so the
          # event's own SHA is `main` at dispatch time (auto-merge.yml dispatches with `--ref main`).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up flyctl (superfly/flyctl-actions/setup-flyctl @ master @ 98172f7)
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Refuse to deploy while a required Fly secret is missing (docs/DEPLOY.md, step 5)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUIRE_CLOUDFLARE_EMAIL_SECRETS: ${{ vars.REQUIRE_CLOUDFLARE_EMAIL_SECRETS }}
          REQUIRE_FREEHIRE_API_KEY: ${{ vars.REQUIRE_FREEHIRE_API_KEY }}
        run: |
          set -euo pipefail
          required="R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_BACKUPS R2_BUCKET_FILES OWNER_EMAIL TURNSTILE_SITE_KEY TURNSTILE_SECRET"
          if [ "${REQUIRE_CLOUDFLARE_EMAIL_SECRETS:-}" = "true" ]; then
            required="$required CLOUDFLARE_EMAIL_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID"
          fi
          # The freehire API plan is bought only after the #710 live walk passes (#708), so the key joins the gate
          # behind an opt-in repository variable and never blocks a deploy while it is off. The deploy job runs on
          # every CI run, so it checks the secret name here and never reads the key itself: only the manual
          # sync-ops-secrets action holds the value.
          if [ "${REQUIRE_FREEHIRE_API_KEY:-}" = "true" ]; then
            required="$required FREEHIRE_API_KEY"
          fi
          present="$(flyctl secrets list -a overture-web --json | jq -r '.[].name')"
          missing=""
          for name in $required; do
            if ! grep -qx "$name" <<<"$present"; then
              missing="$missing $name"
            fi
          done
          # Either the single secret or the versioned rotation chain satisfies the app.
          if ! grep -qx "BETTER_AUTH_SECRET" <<<"$present" && ! grep -qx "BETTER_AUTH_SECRETS" <<<"$present"; then
            missing="$missing BETTER_AUTH_SECRET|BETTER_AUTH_SECRETS"
          fi
          # Any versioned master key is accepted by name; the app's boot check enforces that the chain
          # reaches MASTER_KEY_CURRENT, so a fully rotated deployment without MASTER_KEY_V1 still deploys.
          # MASTER_KEY_CURRENT is optional and defaults to 1 in the app, so it is only required once V1 is gone.
          if ! grep -qE '^MASTER_KEY_V[0-9]+$' <<<"$present"; then
            missing="$missing MASTER_KEY_V<n>"
          fi
          if ! grep -qx "MASTER_KEY_CURRENT" <<<"$present" && ! grep -qx "MASTER_KEY_V1" <<<"$present"; then
            missing="$missing MASTER_KEY_CURRENT"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Fly secrets missing on overture-web:$missing. The app refuses to boot without them; production stays on its current release."
            {
              echo "### Deploy refused"
              echo ""
              echo "These Fly secrets are not set on \`overture-web\`:$missing"
              echo ""
              echo "The server's env schema requires them, so a deploy would crash-loop. Set them with"
              echo "\`fly secrets set\` (docs/DEPLOY.md, step 5); the next successful CI run on \`main\` deploys."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Cloudflare Email Sending guard (docs/DEPLOY.md, M2-02)
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUIRE_EMAIL_SENDING: ${{ vars.REQUIRE_EMAIL_SENDING }}
        run: |
          set -uo pipefail
          # A fresh app (or a zero-machine maintenance window) has nothing to inspect; the post-deploy health gate covers it.
          started="$(flyctl machine list -a overture-web --json 2>/dev/null | jq -r '[.[] | select(.state == "started")] | length' 2>/dev/null || echo 0)"
          if [ "${started:-0}" = "0" ]; then
            echo "::notice::No started machine; skipping the sending-domain check until the app is running."
            exit 0
          fi
          # A down or unresponsive machine must not hold the deploy-main concurrency group for six hours. The check runs
          # with --smol so a 512 MB machine can start a second Bun alongside the server.
          status=0
          output="$(timeout 120s flyctl ssh console -a overture-web -C "bun --smol run /app/scripts/onboard-email-sending.ts --check" 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 124 ]; then
            echo "::warning::The email sending check did not answer within 120s (machine down or unresponsive); treating it as not ready."
          fi
          if grep -q "verdict: ready" <<<"$output"; then
            echo "Cloudflare Email Sending verified."
            exit 0
          fi
          if [ "${REQUIRE_EMAIL_SENDING:-}" = "true" ]; then
            echo "::error::Cloudflare Email Sending is not ready; refusing to deploy. Run scripts/onboard-email-sending.ts (docs/DEPLOY.md, M2-02)."
            {
              echo "### Deploy refused"
              echo ""
              echo "The sending-domain check failed, so a send to anyone but the owner would be refused."
              echo "Pay Workers Paid, then run \`bun run /app/scripts/onboard-email-sending.ts\` on \`overture-web\`"
              echo "(docs/DEPLOY.md, M2-02). Production stays on its current release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning::Cloudflare Email Sending is not ready yet; not blocking this deploy because REQUIRE_EMAIL_SENDING is not set (M2 owner setup #236)."
          {
            echo "### Cloudflare Email Sending pending"
            echo ""
            echo "The sending-domain check failed, but \`REQUIRE_EMAIL_SENDING\` is not set, so this deploy continues."
            echo "M2 owner setup #236 pays for Workers Paid and runs the onboarding script."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Fly
        if: steps.guard.outputs.skip != 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the health route in production
        if: steps.guard.outputs.skip != 'true'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://overture-web.fly.dev/api/health | tee /tmp/health.json; then
              exit 0
            fi
            sleep 10
          done
          echo "health route never answered: $(cat /tmp/health.json || true)"
          exit 1
      - name: Show Fly status and logs after a failed deploy (docs/DEPLOY.md)
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # Diagnostics only: a failed probe must never change the job result.
          echo "::group::flyctl status -a overture-web"
          timeout 30s flyctl status -a overture-web || true
          echo "::endgroup::"
          echo "::group::flyctl logs -a overture-web (last 120 lines)"
          timeout 30s flyctl logs -a overture-web --no-tail | tail -n 120 || true
          echo "::endgroup::"

  deploy-workers:
    # The marketing Worker serves the pages built from this commit, so it ships only after the Fly release that
    # matches it, and only when the Fly deploy was not skipped for a missing FLY_API_TOKEN.
    if: (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.deploy.outputs.skip != 'true'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set (docs/DEPLOY.md, M3-10)
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set yet (docs/DEPLOY.md, M3-10); skipping the Worker deploy."
            {
              echo "### Worker deploy skipped"
              echo ""
              echo "The \`CLOUDFLARE_API_TOKEN\` or \`CLOUDFLARE_ACCOUNT_ID\` repository secret is not set yet (see docs/DEPLOY.md, M3-10)."
              echo "The Fly release went out; the Cloudflare Workers still serve their previous version."
              echo "Once both secrets are set, the next successful CI run on \`main\` deploys them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Set up flyctl (superfly/flyctl-actions/setup-flyctl @ master @ 98172f7)
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Cache Bun dependencies
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      # The Worker serves the prerendered page together with the app's `/assets/*` bundle, so it must ship the HTML of
      # the release that is now live on Fly, not a second build of the same commit: `.dockerignore` gives the Docker
      # build context a different set of files for Tailwind to scan, which changed the CSS and cascaded into a
      # different `main-*.js` hash. The Worker's HTML referenced a `main-*.js` that only existed in its own build, the
      # origin answered 404, and the landing never hydrated (blank live count, frozen hero counter). Extract the build
      # from the machine instead, and fail loudly rather than ship HTML whose assets the origin does not have.
      - name: Sync dist-marketing from the deployed overture-web machine
        if: steps.guard.outputs.skip != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf dist-marketing
          # flyctl prints its own connection text (for example "Connecting to fdaa:…") on stdout, which corrupts a raw
          # gzip stream fed to tar. `-q` silences that progress, and the archive travels base64-encoded between
          # sentinel markers so only the payload lines can ever reach `tar`: a stray notice is discarded, and a
          # missing frame or corrupt payload fails the job instead of shipping half a page.
          begin_marker=OVERTURE-TAR-BEGIN
          end_marker=OVERTURE-TAR-END
          archive="$(mktemp)"
          status=0
          # `flyctl ssh console -C` hands the string to the machine's SSH server, which word-splits it with shell-like
          # quoting and then execs the first word directly: it never interprets `;`, `|` or `&&`. Passing the
          # multi-statement extraction bare made the remote `printf` print the whole script as literal arguments, so
          # the sentinels never framed anything and the job died on `gzip: stdin: unexpected end of file`. Wrapping it
          # in `sh -c '…'` gives the machine one command whose single argument is the whole script, and `set -e` turns
          # a failed `tar` (or `base64`) into the console's exit code instead of a silently empty payload.
          #
          # The tarball is named after this shell's pid, because a manual recovery running the snippet in docs/DEPLOY.md
          # must never truncate or delete the copy a deploy is still streaming; the exit trap removes it on success and
          # on failure, so the machine keeps no partial archive either way.
          remote_archive="/tmp/overture-dist-marketing-$$.tgz"
          #
          # A hung SSH console must not hold the deploy-main concurrency group for six hours.
          timeout 180s flyctl ssh console -q -a overture-web -C \
            "sh -c 'set -e; trap \"rm -f ${remote_archive}\" EXIT; tar -czf ${remote_archive} -C /app dist-marketing; echo ${begin_marker}; base64 ${remote_archive}; echo ${end_marker}'" \
            > "$archive" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Could not extract /app/dist-marketing from overture-web (exit $status); the marketing Worker ships prerendered HTML, so refusing to deploy without it."
            exit 1
          fi
          if [ ! -s "$archive" ]; then
            echo "::error::flyctl returned nothing while extracting /app/dist-marketing; refusing to deploy HTML that cannot hydrate."
            exit 1
          fi
          status=0
          awk -v begin="$begin_marker" -v end="$end_marker" '
            $0 == begin { inside = 1; started = 1; next }
            $0 == end { inside = 0; closed = 1; next }
            inside { print }
            END { if (!started || !closed) exit 3 }
          ' "$archive" | base64 -d | tar -xzf - || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::The archive from overture-web was not a clean base64 tar stream (exit $status); refusing to deploy, because stray flyctl output must never reach tar."
            exit 1
          fi
          if [ ! -f dist-marketing/index.html ] || ! grep -q '<div id="root">' dist-marketing/index.html; then
            echo "::error::/app/dist-marketing/index.html is missing or not a prerendered page on overture-web; refusing to deploy HTML that cannot hydrate."
            exit 1
          fi
          echo "synced $(find dist-marketing -type f | wc -l) file(s) from overture-web"
      - name: Verify the synced marketing assets answer from the Fly release (before the Worker ships)
        if: steps.guard.outputs.skip != 'true'
        run: bun run scripts/verify-marketing-assets.ts --dir dist-marketing --base https://overture-web.fly.dev
      - name: Deploy the inbound mail Worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: workers/inbound-mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars is mandatory: the owner sets INBOUND_HMAC_SECRET as a Worker secret, and a deploy without it
        # would stop inbound verification.
        run: bunx wrangler deploy --keep-vars
      - name: Deploy the marketing Worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: workers/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
      - name: Verify the live landing hydrates from the Fly release (after the Worker ships)
        if: steps.guard.outputs.skip != 'true'
        # Cloudflare can serve the previous deployment for a few seconds after `wrangler deploy`, so retry.
        run: bun run scripts/verify-marketing-assets.ts --dir dist-marketing --base https://tryoverture.com --attempts 5
      - name: Deploy the sentinel Worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: workers/sentinel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --keep-vars is mandatory: ALERT_NTFY_URL and the analytics token are dashboard-set secrets, and a deploy
        # without it would silence the spend alerts.
        run: bunx wrangler deploy --keep-vars
      - name: Deploy the freehire proxy Worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: workers/freehire-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
