name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Check the health route in production
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://overture-web.fly.dev/api/health | tee /tmp/health.json; then
              exit 0
            fi
            sleep 10
          done
          echo "health route never answered: $(cat /tmp/health.json || true)"
          exit 1
