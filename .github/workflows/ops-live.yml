name: Ops live

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which live operation to run"
        required: true
        type: choice
        options:
          - check-secrets
          - onboard-email
          - setup-vapid
          - seed-catalog
          - setup-stripe
          - live-diagnostics
          - vacuum-db
          - reset-catalog
          - sync-ops-secrets
      rotate_webhook:
        description: "Replace the Stripe webhook endpoint and rotate its signing secret"
        required: false
        type: boolean
        default: false
      rotate_vapid:
        description: "Replace existing VAPID keys on overture-web"
        required: false
        type: boolean
        default: false
      reconcile_prices:
        description: "Replace drifted lookup-key prices on the existing products and archive the old prices"
        required: false
        type: boolean
        default: false
      stripe_env:
        description: "Stripe environment to configure on overture-web"
        required: false
        type: choice
        options:
          - sandbox
          - production
        default: sandbox
      force_vacuum:
        description: "Compact the application database even when its freelist is below the 50 MB threshold"
        required: false
        type: boolean
        default: false
      enable_catalog_r2_hot_swap:
        description: "Set CATALOG_R2_HOT_SWAP=true on overture-web during sync-ops-secrets"
        required: false
        type: boolean
        default: false

concurrency:
  group: ops-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unless FLY_API_TOKEN is set (docs/DEPLOY.md, one-time step 6)
        id: guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::notice::FLY_API_TOKEN is not set yet (docs/DEPLOY.md one-time step 6); skipping the ops-live action."
            {
              echo "### Ops-live skipped"
              echo ""
              echo "The \`FLY_API_TOKEN\` repository secret is not set yet (see docs/DEPLOY.md, one-time step 6)."
              echo "Nothing ran. Once \`gh secret set FLY_API_TOKEN\` is done, re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'
      - name: Scan this checkout for secrets and verify the lint configuration
        if: steps.guard.outputs.skip != 'true'
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSLo "$work/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  $work/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$work/gitleaks" "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" git --log-opts=-1 --config .gitleaks.toml --redact --exit-code 1 --no-banner
          bun run lint:config
      - name: Set up flyctl (superfly/flyctl-actions/setup-flyctl @ master @ 98172f7)
        if: steps.guard.outputs.skip != 'true'
        uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200

      - name: List the Fly secret names and the app status
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'check-secrets'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list -a overture-web --json | jq -r '[.[].name] | sort | .[]'
          flyctl status -a overture-web

      - name: Check the production health route
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'check-secrets'
        run: curl -fsS https://tryoverture.com/api/health

      - name: Onboard the Cloudflare sending domain on overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'onboard-email'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          output="$(timeout 300s flyctl ssh console -a overture-web -C "bun run /app/scripts/onboard-email-sending.ts --all" 2>&1)" || status=$?
          printf '%s\n' "$output"
          {
            echo "### Cloudflare Email Sending onboarding"
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ]; then
            echo "::error::The onboarding script did not answer within 300s (machine down or unresponsive)."
            exit 1
          fi
          if ! grep -q "Cloudflare Email Sending" <<<"$output"; then
            echo "::error::The onboarding command failed to run on overture-web (exit $status)."
            exit 1
          fi
          if ! grep -q "verdict: verified" <<<"$output"; then
            echo "::warning::The sending domain is not verified yet; DNS usually propagates in 5-15 minutes. Re-run this action."
          fi

      - name: Check the sending-domain records
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'onboard-email'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          output="$(timeout 120s flyctl ssh console -a overture-web -C "bun run /app/scripts/onboard-email-sending.ts --check --all" 2>&1)" || status=$?
          printf '%s\n' "$output"
          {
            echo "### Cloudflare sending-domain check"
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ]; then
            echo "::error::The sending-domain check did not answer within 120s (machine down or unresponsive)."
            exit 1
          fi
          if ! grep -q "Cloudflare Email Sending check" <<<"$output"; then
            echo "::error::The sending-domain check failed to run on overture-web (exit $status)."
            exit 1
          fi
          if ! grep -q "verdict: ready" <<<"$output"; then
            echo "::warning::The sending domain is not ready; the records above name every missing one."
          fi

      - name: Read the Fly secret names for the VAPID action
        id: vapid-secrets
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-vapid'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list -a overture-web --json > "$RUNNER_TEMP/fly-secrets.json"
          names="$(jq -r '.[].name' "$RUNNER_TEMP/fly-secrets.json")"
          if grep -qx 'VAPID_PUBLIC_KEY' <<<"$names"; then
            echo "public_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "public_present=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx 'VAPID_PRIVATE_KEY' <<<"$names"; then
            echo "private_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "private_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and set the VAPID keys on overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-vapid'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ROTATE_VAPID: ${{ inputs.rotate_vapid }}
          PUBLIC_PRESENT: ${{ steps.vapid-secrets.outputs.public_present }}
          PRIVATE_PRESENT: ${{ steps.vapid-secrets.outputs.private_present }}
        run: |
          set -euo pipefail
          if [ "${PUBLIC_PRESENT}" = "true" ] && [ "${PRIVATE_PRESENT}" = "true" ] && [ "${ROTATE_VAPID}" != "true" ]; then
            echo "VAPID keys are already set on overture-web."
            {
              echo "### VAPID keys already set"
              echo ""
              echo "Both \`VAPID_PUBLIC_KEY\` and \`VAPID_PRIVATE_KEY\` are on \`overture-web\`; re-run with \`rotate_vapid=true\` to replace them."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun run scripts/generate-vapid.ts --out-env /tmp/vapid-setup.env
          value() { sed -n "s/^$1=//p" /tmp/vapid-setup.env; }
          public_key="$(value VAPID_PUBLIC_KEY)"
          private_key="$(value VAPID_PRIVATE_KEY)"
          if [ -z "$public_key" ] || [ -z "$private_key" ]; then
            echo "::error::The generator wrote no VAPID key pair; refusing to set Fly secrets."
            exit 1
          fi
          echo "::add-mask::$public_key"
          echo "::add-mask::$private_key"
          printf '%s\n' "VAPID_PUBLIC_KEY=$public_key" "VAPID_PRIVATE_KEY=$private_key" | flyctl secrets import -a overture-web

      - name: Verify the production health route after the VAPID release
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-vapid'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://tryoverture.com/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The health route did not answer within 120s after the VAPID release."
          exit 1

      - name: Remove the VAPID setup file
        if: always() && inputs.action == 'setup-vapid'
        run: rm -f /tmp/vapid-setup.env

      - name: Seed the catalog and enqueue the backfill on overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'seed-catalog'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          run_ssh() {
            duration="$1"
            label="$2"
            remote_command="$3"
            status=0
            output="$(timeout "$duration" flyctl ssh console -a overture-web -C "$remote_command" 2>&1)" || status=$?
            printf '%s\n' "$output"
            {
              echo "### $label"
              echo ""
              echo '```'
              printf '%s\n' "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -eq 124 ]; then
              echo "::error::$label did not answer within $duration (machine down or unresponsive)."
              exit 1
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed on overture-web (exit $status)."
              exit 1
            fi
          }
          run_ssh 60s "create /data/seed" "mkdir -p /data/seed"
          run_ssh 60s "chown /data/seed" "chown app:app /data/seed"
          run_ssh 300s "fetch-seed" "gosu app bun run /app/scripts/fetch-seed.ts --dir /data/seed"
          run_ssh 300s "load-discovered-boards" "gosu app bun run /app/scripts/load-discovered-boards.ts --db /data/app.sqlite --manifest /data/seed/manifest.json --companies /data/seed/companies.parquet"
          run_ssh 120s "enqueue-backfill" "gosu app bun run /app/scripts/enqueue-backfill.ts --db /data/app.sqlite"

      - name: Verify the production health route after the catalog seed
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'seed-catalog'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://tryoverture.com/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The health route did not answer within 120s after the catalog seed."
          exit 1

      - name: Read the Fly secret names for the Stripe action
        id: stripe-secrets
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-stripe'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets list -a overture-web --json > "$RUNNER_TEMP/fly-secrets.json"
          names="$(jq -r '.[].name' "$RUNNER_TEMP/fly-secrets.json")"
          if grep -qx 'STRIPE_WEBHOOK_SECRET' <<<"$names"; then
            echo "webhook_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "webhook_present=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx 'CARD_FINGERPRINT_SECRET' <<<"$names"; then
            echo "fingerprint_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "fingerprint_present=false" >> "$GITHUB_OUTPUT"
          fi
          current_stripe_env="unknown"
          probe="$(timeout 30s flyctl ssh console -a overture-web -C "sh -c 'case \"\${STRIPE_SECRET_KEY:-}\" in sk_test_*|rk_test_*) printf sandbox;; sk_live_*|rk_live_*) printf production;; \"\") printf none;; *) printf unknown;; esac'" 2>/dev/null)" || probe=""
          case "$probe" in
            sandbox|production|none) current_stripe_env="$probe" ;;
          esac
          echo "current_stripe_env=$current_stripe_env" >> "$GITHUB_OUTPUT"
          echo "::notice::The Stripe environment currently active on overture-web is ${current_stripe_env}."

      - name: Create the plans, webhook and portal and set the Fly secrets
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-stripe'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          STRIPE_ENV: ${{ inputs.stripe_env || 'sandbox' }}
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          STRIPE_PROD_SECRET_KEY: ${{ secrets.STRIPE_PROD_SECRET_KEY }}
          STRIPE_SECRET_KEY_LEGACY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_ORIGIN: https://tryoverture.com
          ROTATE_WEBHOOK: ${{ inputs.rotate_webhook }}
          RECONCILE_PRICES: ${{ inputs.reconcile_prices }}
          WEBHOOK_PRESENT: ${{ steps.stripe-secrets.outputs.webhook_present }}
          CURRENT_STRIPE_ENV: ${{ steps.stripe-secrets.outputs.current_stripe_env }}
          FINGERPRINT_PRESENT: ${{ steps.stripe-secrets.outputs.fingerprint_present }}
        run: |
          set -euo pipefail
          stripe_env="${STRIPE_ENV:-sandbox}"
          case "$stripe_env" in
            sandbox)
              STRIPE_SECRET_KEY="${STRIPE_SANDBOX_SECRET_KEY:-}"
              if [ -z "$STRIPE_SECRET_KEY" ]; then
                echo "::error::The STRIPE_SANDBOX_SECRET_KEY repository secret is not set. Add it with gh secret set STRIPE_SANDBOX_SECRET_KEY -R a-hagi613/overture, then re-run with stripe_env=sandbox."
                exit 1
              fi
              ;;
            production)
              STRIPE_SECRET_KEY="${STRIPE_PROD_SECRET_KEY:-${STRIPE_SECRET_KEY_LEGACY:-}}"
              if [ -z "$STRIPE_SECRET_KEY" ]; then
                echo "::error::The STRIPE_PROD_SECRET_KEY repository secret is not set and no legacy STRIPE_SECRET_KEY fallback is available. Add it with gh secret set STRIPE_PROD_SECRET_KEY -R a-hagi613/overture, then re-run with stripe_env=production."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown stripe_env '${stripe_env}'; expected sandbox or production."
              exit 1
              ;;
          esac
          echo "::add-mask::$STRIPE_SECRET_KEY"
          export STRIPE_SECRET_KEY
          extra_args=(--out-env /tmp/stripe-setup.env)
          if [ "${ROTATE_WEBHOOK}" = "true" ] || [ "${WEBHOOK_PRESENT}" != "true" ] || [ "${CURRENT_STRIPE_ENV}" != "${stripe_env}" ]; then
            extra_args+=(--rotate-webhook)
          fi
          if [ "${RECONCILE_PRICES}" = "true" ]; then
            extra_args+=(--reconcile-prices)
          fi
          bun run scripts/setup-stripe.ts "${extra_args[@]}"
          value() { sed -n "s/^$1=//p" /tmp/stripe-setup.env | head -n 1; }
          week="$(value STRIPE_PRICE_WEEK)"
          month="$(value STRIPE_PRICE_MONTH)"
          if [ -z "$week" ] || [ -z "$month" ]; then
            echo "::error::The setup script wrote no plan price ids; refusing to set Fly secrets."
            exit 1
          fi
          set_args=(
            "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY"
            "STRIPE_PRICE_WEEK=$week"
            "STRIPE_PRICE_MONTH=$month"
          )
          set_names=("STRIPE_SECRET_KEY" "STRIPE_PRICE_WEEK" "STRIPE_PRICE_MONTH")
          if grep -q '^STRIPE_WEBHOOK_SECRET=' /tmp/stripe-setup.env; then
            webhook_secret="$(value STRIPE_WEBHOOK_SECRET)"
            echo "::add-mask::$webhook_secret"
            set_args+=("STRIPE_WEBHOOK_SECRET=$webhook_secret")
            set_names+=("STRIPE_WEBHOOK_SECRET")
          fi
          if [ "${FINGERPRINT_PRESENT}" != "true" ]; then
            fingerprint="$(openssl rand -hex 32)"
            echo "::add-mask::$fingerprint"
            set_args+=("CARD_FINGERPRINT_SECRET=$fingerprint")
            set_names+=("CARD_FINGERPRINT_SECRET")
          fi
          printf '%s\n' "${set_args[@]}" | flyctl secrets import -a overture-web
          {
            echo "### Stripe environment configured on overture-web"
            echo ""
            echo "Configured \`stripe_env\`: \`${stripe_env}\`."
            echo ""
            echo "Variable names set on overture-web (values are never printed):"
            echo ""
            printf -- '- `%s`\n' "${set_names[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the production health route
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'setup-stripe'
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://tryoverture.com/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The health route did not answer within 120s after the Stripe release."
          exit 1

      - name: Remove the Stripe setup file
        if: always() && inputs.action == 'setup-stripe'
        run: rm -f /tmp/stripe-setup.env

      - name: Run the live diagnostics on overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'live-diagnostics'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          output="$(timeout 120s flyctl ssh console -a overture-web -C "bun run /app/scripts/onboard-email-sending.ts --check" 2>&1)" || status=$?
          printf '%s\n' "$output"
          {
            echo "### Cloudflare sending-domain check"
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ]; then
            echo "::error::The sending-domain check did not answer within 120s."
            exit 1
          fi
          set -e
          timeout 120s flyctl ssh console -a overture-web -C "bun run /app/scripts/live-diagnostics.ts"

      - name: Check the database sizes before a vacuum on overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'vacuum-db'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bun run scripts/vacuum-fly.ts plan

      - name: Compact the application database when its freelist is worth reclaiming
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'vacuum-db'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FORCE_VACUUM: ${{ inputs.force_vacuum }}
        run: |
          set -euo pipefail
          if [ "${FORCE_VACUUM}" = "true" ]; then
            bun run scripts/vacuum-fly.ts compact --force
          else
            bun run scripts/vacuum-fly.ts compact
          fi

      - name: Show the overture-web status, volume and processes before a catalog reset
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'reset-catalog'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # Diagnostics are best effort: an unresponsive or down machine must never hide the status that explains why.
          echo "::group::flyctl status -a overture-web"
          timeout 30s flyctl status -a overture-web || true
          echo "::endgroup::"
          echo "::group::/data and the processes on overture-web"
          # oven/bun:1.4.5-slim has no ps, so list processes straight from /proc.
          timeout 30s flyctl ssh console -a overture-web -C "sh -c 'ls -lh /data; df -h /data; for p in /proc/[0-9]*; do [ -r \"\$p/cmdline\" ] && printf \"%s \" \"\${p#/proc/}\" && tr \"\\0\" \" \" < \"\$p/cmdline\" && echo \"\"; done'" || true
          echo "::endgroup::"

      - name: Delete only the catalog database files on the overture-web volume
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'reset-catalog'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          # The catalog is rebuildable from the feeds (ADR 0036), so deleting it is ordinary recovery work. The
          # application database is never touched: it holds every account, application and message.
          remote_command="rm -f /data/catalog.sqlite /data/catalog.sqlite-wal /data/catalog.sqlite-shm /data/catalog.sqlite-journal /data/catalog-*.sqlite* && ls -lh /data"
          case "$remote_command" in
            *app.sqlite*)
              echo "::error::Refusing to run a catalog reset that names app.sqlite; the application database is never touched."
              exit 1
              ;;
          esac
          status=0
          output="$(timeout 60s flyctl ssh console -a overture-web -C "sh -c '$remote_command'" 2>&1)" || status=$?
          printf '%s\n' "$output"
          {
            echo "### Catalog database files removed"
            echo ""
            echo '```'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 124 ]; then
            echo "::error::The catalog file removal did not answer within 60s (machine down or unresponsive)."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::The catalog file removal failed on overture-web (exit $status)."
            exit 1
          fi

      - name: Restart overture-web onto an empty catalog database
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'reset-catalog'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list -a overture-web --json | jq -r '[.[] | select((.config.metadata // {}).fly_process_group == "app")][0].id // empty')"
          if [ -z "$machine_id" ]; then
            machine_id="$(flyctl machines list -a overture-web --json | jq -r '[.[] | select(.state == "started")][0].id // empty')"
          fi
          if [ -z "$machine_id" ]; then
            echo "::error::Found no app machine to restart on overture-web."
            exit 1
          fi
          loopback_healthy() {
            timeout 30s flyctl ssh console -a overture-web \
              -C "sh -c 'curl -fsS -m 3 http://127.0.0.1:3000/api/health >/dev/null 2>&1'" >/dev/null 2>&1
          }
          if loopback_healthy; then
            echo "overture-web answers on port 3000; restarting the app machine."
            flyctl machine restart "$machine_id" -a overture-web
            exit 0
          fi
          # A process that never reached port 3000 is stuck inside the catalog migration. The image has no process
          # tools, so read /proc directly and match only a bun process running the server entrypoint; PID 1, the
          # shell, and the parent replicator never match, and Fly restarts the machine once the child is gone.
          echo "overture-web does not answer on port 3000 yet; killing the hung Bun server so Fly restarts it."
          kill_output="$(timeout 30s flyctl ssh console -a overture-web -C "sh -c 'for p in /proc/[0-9]*; do [ \"\$p\" = /proc/1 ] && continue; [ -r \"\$p/cmdline\" ] || continue; cmd=\"\$(tr \"\\0\" \" \" < \"\$p/cmdline\" 2>/dev/null)\"; case \"\$cmd\" in \"bun \"*|\"/*/bun \"*|\"sh -c bun \"*|\"/bin/sh -c bun \"*) case \"\$cmd\" in *\" /app/src/server/main.ts\"*) kill -9 \"\${p#/proc/}\" 2>/dev/null && echo \"killed \${p#/proc/}\" ;; esac ;; esac; done'" 2>&1)" || true
          printf '%s\n' "$kill_output"
          case "$kill_output" in
            *"killed "*)
              echo "the hung Bun server was killed; Fly restarts it onto the empty catalog."
              ;;
            *)
              echo "no hung Bun server was found; restarting the app machine."
              flyctl machine restart "$machine_id" -a overture-web
              ;;
          esac

      - name: Wait for overture-web to serve health after the catalog reset
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'reset-catalog'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 36); do
            if health="$(curl -fsS -m 5 https://tryoverture.com/api/health)"; then
              printf '%s\n' "$health"
              echo "overture-web recovered on attempt $attempt."
              timeout 30s flyctl status -a overture-web || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::The health route did not answer within 180s after the catalog reset."
          status_output="$(timeout 30s flyctl status -a overture-web 2>&1 || true)"
          log_output="$(timeout 30s flyctl logs -a overture-web --no-tail 2>&1 | tail -n 80 || true)"
          printf '%s\n' "$status_output" "$log_output"
          {
            echo "### Catalog reset did not recover"
            echo ""
            echo "The health route did not answer within 180s. Machine status:"
            echo '```'
            printf '%s\n' "$status_output"
            echo '```'
            echo "Last 80 log lines:"
            echo '```'
            printf '%s\n' "$log_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Sync the ops secrets and flags to overture-web
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'sync-ops-secrets'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ALERT_NTFY_URL: ${{ secrets.ALERT_NTFY_URL }}
          CATALOG_REFRESH_SECRET: ${{ secrets.CATALOG_REFRESH_SECRET }}
          ALLOWED_SIGNUP_EMAILS: ${{ secrets.ALLOWED_SIGNUP_EMAILS }}
          ENABLE_CATALOG_R2_HOT_SWAP: ${{ inputs.enable_catalog_r2_hot_swap }}
        run: |
          set -euo pipefail
          set_args=()
          key_names=()
          if [ -n "${ALERT_NTFY_URL:-}" ]; then
            echo "::add-mask::$ALERT_NTFY_URL"
            set_args+=("ALERT_NTFY_URL=$ALERT_NTFY_URL")
            key_names+=("ALERT_NTFY_URL")
          fi
          if [ -n "${CATALOG_REFRESH_SECRET:-}" ]; then
            echo "::add-mask::$CATALOG_REFRESH_SECRET"
            set_args+=("CATALOG_REFRESH_SECRET=$CATALOG_REFRESH_SECRET")
            key_names+=("CATALOG_REFRESH_SECRET")
          fi
          if [ -n "${ALLOWED_SIGNUP_EMAILS:-}" ]; then
            echo "::add-mask::$ALLOWED_SIGNUP_EMAILS"
            set_args+=("ALLOWED_SIGNUP_EMAILS=$ALLOWED_SIGNUP_EMAILS")
            key_names+=("ALLOWED_SIGNUP_EMAILS")
          fi
          if [ "${ENABLE_CATALOG_R2_HOT_SWAP:-false}" = "true" ]; then
            set_args+=("CATALOG_R2_HOT_SWAP=true")
            key_names+=("CATALOG_R2_HOT_SWAP=true")
          fi
          if [ "${#set_args[@]}" -eq 0 ]; then
            echo "::error::No secrets or flags were configured to sync."
            exit 1
          fi
          printf '%s\n' "${set_args[@]}" | flyctl secrets import -a overture-web
          {
            echo "### Ops secrets synced to overture-web"
            echo ""
            echo "Imported names only; values are never printed:"
            echo ""
            printf -- '- `%s`\n' "${key_names[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the production health route after the ops secrets sync
        if: steps.guard.outputs.skip != 'true' && inputs.action == 'sync-ops-secrets'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 24); do
            if curl -fsS -m 5 https://tryoverture.com/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::The health route did not answer within 120s after the ops secrets sync."
          timeout 30s flyctl logs -a overture-web --no-tail | tail -n 80 || true
          exit 1
