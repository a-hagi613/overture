name: Workable feed

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      allow_row_drop:
        description: "Publish a snapshot whose row count dropped more than 20%"
        type: boolean
        default: false

concurrency:
  group: workable-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip unless the R2 secrets are configured (docs/DEPLOY.md, the Workable feed pass)
        id: guard
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_FILES: ${{ secrets.R2_BUCKET_FILES }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_FILES R2_ENDPOINT; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::R2 secrets not configured yet; skipping the Workable feed pass."
            {
              echo "### Workable feed skipped — R2 secrets not configured yet"
              echo ""
              echo "These repository secrets are missing:$missing"
              echo ""
              echo "Nothing was fetched and no snapshot was published, so the owner was not alerted."
              echo "Set them with \`gh secret set <name>\` (docs/DEPLOY.md, the Workable feed pass);"
              echo "the next scheduled run at 04:00 UTC then streams the feed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: bun install --frozen-lockfile
      - name: Stream the feed and write the target-relevant snapshot to R2
        if: steps.guard.outputs.skip != 'true'
        env:
          WORKABLE_LIVE_FETCH: "1"
          WORKABLE_FEED_URL: ${{ vars.WORKABLE_FEED_URL || 'https://www.workable.com/boards/workable.xml' }}
          ALLOW_ROW_DROP: ${{ inputs.allow_row_drop == true && '1' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_FILES: ${{ secrets.R2_BUCKET_FILES }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          flag=""
          if [ "$ALLOW_ROW_DROP" = "1" ]; then
            flag="--allow-row-drop"
          fi
          bun run scripts/workable-feed-pass.ts $flag
      - name: Tell the owner the pass failed
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          NTFY_URL: ${{ secrets.WORKABLE_ALERT_NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            exit 0
          fi
          curl -fsS -X POST -H "Title: Workable feed pass failed" \
            --data-binary "The scheduled Workable pass did not finish. The last snapshot stands." \
            "$NTFY_URL"
