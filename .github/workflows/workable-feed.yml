name: Workable feed

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      allow_row_drop:
        description: "Publish a snapshot whose row count dropped more than 20%"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: workable-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pass:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Stream the feed and write the target-relevant snapshot to R2
        env:
          WORKABLE_LIVE_FETCH: "1"
          WORKABLE_FEED_URL: ${{ vars.WORKABLE_FEED_URL || 'https://www.workable.com/boards/workable.xml' }}
          ALLOW_ROW_DROP: ${{ inputs.allow_row_drop == true && '1' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_FILES: ${{ secrets.R2_BUCKET_FILES }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          flag=""
          if [ "$ALLOW_ROW_DROP" = "1" ]; then
            flag="--allow-row-drop"
          fi
          bun run scripts/workable-feed-pass.ts $flag
      - name: Tell the owner the pass failed
        if: failure()
        env:
          NTFY_URL: ${{ secrets.WORKABLE_ALERT_NTFY_URL }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            exit 0
          fi
          curl -fsS -X POST -H "Title: Workable feed pass failed" \
            --data-binary "The scheduled Workable pass did not finish. The last snapshot stands." \
            "$NTFY_URL"
