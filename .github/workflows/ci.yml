name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.plan.outputs.e2e }}
      matrix: ${{ steps.plan.outputs.matrix }}
      container: ${{ steps.plan.outputs.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      # Plan after verify: the plan file lands in the repo root and `bun fmt --check` would reject it.
      - run: bun run verify
      - id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            bun run scripts/e2e-ci.ts plan --base "origin/${BASE_REF}" --out e2e-plan.json --github-output "${GITHUB_OUTPUT}"
          else
            bun run scripts/e2e-ci.ts plan --out e2e-plan.json --github-output "${GITHUB_OUTPUT}"
          fi
      - name: Build the inbound mail Worker
        run: cd workers/inbound-mail && bun run dry-run
      - name: Build the sentinel Worker
        run: cd workers/sentinel && bun run dry-run
      - name: Build the marketing Worker
        run: cd workers/marketing && bun run dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-plan
          path: e2e-plan.json
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: marketing-dist
          path: dist-marketing
          retention-days: 1
  security-and-restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Install gitleaks 8.30.1 and verify its sha256
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSLo "$work/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  $work/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$work/gitleaks" "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
      - name: Scan the full history of main
        if: github.event_name == 'push'
        run: gitleaks git --log-opts=HEAD --config .gitleaks.toml --redact --exit-code 1 --no-banner
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --config .gitleaks.toml --redact --exit-code 1 --no-banner
      - name: Private-files guard
        run: bun run scripts/check-private-files.ts
      - name: Install Litestream
        run: |
          litestream_asset=litestream-0.5.18-linux-x86_64.tar.gz
          curl -fsSLo "/tmp/$litestream_asset" "https://github.com/benbjohnson/litestream/releases/download/v0.5.18/$litestream_asset"
          curl -fsSLo /tmp/checksums.txt https://github.com/benbjohnson/litestream/releases/download/v0.5.18/checksums.txt
          grep " $litestream_asset\$" /tmp/checksums.txt | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$litestream_asset" -C "$HOME/.local/bin" litestream
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/litestream" version
      - run: bun run scripts/restore-drill.ts local
  e2e:
    runs-on: ubuntu-latest
    # Fail fast: e2e starts only after the gate checks pass, and one failing shard cancels the rest.
    needs: [gate]
    if: needs.gate.outputs.e2e == 'true'
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Take the built app from the gate job
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Take the marketing build from the gate job
        uses: actions/download-artifact@v8
        with:
          name: marketing-dist
          path: dist-marketing
      - name: Take the shard plan from the gate job
        uses: actions/download-artifact@v8
        with:
          name: e2e-plan
          path: .
      - name: Install Bun (the Playwright image has no unzip for setup-bun)
        run: |
          curl -fsSLo /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/bun-linux-x64.zip
          python3 -m zipfile -e /tmp/bun.zip /tmp/bun
          mkdir -p "$HOME/.bun/bin"
          install -m 0755 /tmp/bun/bun-linux-x64/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --version
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-e2e-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-e2e-bun-
      - run: bun install --frozen-lockfile
      - name: Resolve shard files
        id: shard
        run: |
          files=$(bun run scripts/e2e-ci.ts shard --plan e2e-plan.json --shard "${{ matrix.shard }}")
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          if echo " ${files} " | grep -q "test/e2e/backup-"; then
            echo "needs_litestream=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_litestream=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Install Litestream
        if: steps.shard.outputs.needs_litestream == 'true'
        run: |
          litestream_asset=litestream-0.5.18-linux-x86_64.tar.gz
          curl -fsSLo "/tmp/$litestream_asset" "https://github.com/benbjohnson/litestream/releases/download/v0.5.18/$litestream_asset"
          curl -fsSLo /tmp/checksums.txt https://github.com/benbjohnson/litestream/releases/download/v0.5.18/checksums.txt
          grep " $litestream_asset\$" /tmp/checksums.txt | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$litestream_asset" -C "$HOME/.local/bin" litestream
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/litestream" version
      - name: Install stripe-mock 0.206.0 and verify its sha256
        shell: bash
        env:
          STRIPE_MOCK_SHA256: b6fe5a8f02aaeb5a5001710b304fc93a222f1983a9a6050a38f55cfdc48b8d19
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          curl -fsSLo "$work/stripe-mock.tar.gz" https://github.com/stripe/stripe-mock/releases/download/v0.206.0/stripe-mock_0.206.0_linux_amd64.tar.gz
          echo "${STRIPE_MOCK_SHA256}  $work/stripe-mock.tar.gz" | sha256sum -c -
          tar -xzf "$work/stripe-mock.tar.gz" -C "$work" stripe-mock
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$work/stripe-mock" "$HOME/.local/bin/stripe-mock"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/stripe-mock" --version
      - name: Run this shard
        run: bun node_modules/playwright/cli.js test --workers=3 ${{ steps.shard.outputs.files }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.shard }}
          path: test-results/e2e.json
          if-no-files-found: ignore
          retention-days: 1
  record:
    runs-on: ubuntu-latest
    needs: [e2e]
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: reports
          merge-multiple: true
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run scripts/e2e-ci.ts timings --reports reports
      - run: bun run scripts/e2e-ci.ts map
      - run: bunx oxfmt test/e2e/timings.json test/e2e/reach-map.json
      - name: Commit the recorded timings and reach map to main
        run: |
          set -euo pipefail
          git config user.name "overture-ci"
          git config user.email "ci@overture.invalid"
          git add test/e2e/timings.json test/e2e/reach-map.json
          if git diff --cached --quiet; then
            echo "nothing new to record"
            exit 0
          fi
          git commit -m "Record e2e timings and the reach map from the main run"
          git push --no-verify || { git pull --rebase origin main && git push --no-verify; }
  container:
    runs-on: ubuntu-latest
    needs: [gate]
    if: needs.gate.outputs.container == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx (docker/setup-buildx-action v4.4.1 @ f87e599)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the container image (docker/build-push-action v7.4.0 @ c3c9e26)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: overture:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the container and check the health route
        run: |
          set -euo pipefail
          master_key_v1=$(printf '%s' "overture ci container master key v1" | openssl dgst -sha256 -binary | base64)
          fly_env="$RUNNER_TEMP/fly-production.env"
          python3 - "$fly_env" <<'PY'
          import sys
          import tomllib

          with open("fly.toml", "rb") as source:
              values = tomllib.load(source)["env"]

          with open(sys.argv[1], "w", encoding="utf-8") as target:
              for name, value in values.items():
                  target.write(f"{name}={value}\n")
          PY
          docker run -d --name overture-ci \
            --env-file "$fly_env" \
            -e LITESTREAM_ENABLED=false \
            -e ENABLE_TEST_ROUTES=false \
            -e MASTER_KEY_V1="$master_key_v1" \
            -e BETTER_AUTH_SECRET=e2e-auth-secret-0123456789abcdef \
            -e GOOGLE_CLIENT_ID=e2e-google-client-id \
            -e GOOGLE_CLIENT_SECRET=e2e-google-client-secret \
            -e LINKEDIN_CLIENT_ID=e2e-linkedin-client-id \
            -e LINKEDIN_CLIENT_SECRET=e2e-linkedin-client-secret \
            -e OWNER_EMAIL=maya.okafor@example.com \
            -e TURNSTILE_SECRET=1x0000000000000000000000000000000AA \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -p 127.0.0.1:3100:3000 \
            overture:ci
          deadline=$(date -u +%s)
          deadline=$((deadline + 60))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3100/api/health || true)
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' overture-ci)" != "true" ]; then
              docker logs overture-ci
              exit 1
            fi
            sleep 2
          done
          docker logs overture-ci
          exit 1
      - run: docker logs overture-ci
        if: always()
      - run: docker rm -f overture-ci
        if: always()

  ci-ok:
    if: always()
    needs: [gate, security-and-restore, e2e, container]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded, or was deliberately skipped
        run: |
          set -euo pipefail
          for result in ${{ join(needs.*.result, ' ') }}; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "a needed job finished as ${result}"
                exit 1
                ;;
            esac
          done
