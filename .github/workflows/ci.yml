name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint:config
      - run: bunx oxlint --deny-warnings --format=agent
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run db:verify
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Litestream
        run: |
          litestream_asset=litestream-0.5.18-linux-x86_64.tar.gz
          curl -fsSLo "/tmp/$litestream_asset" "https://github.com/benbjohnson/litestream/releases/download/v0.5.18/$litestream_asset"
          curl -fsSLo /tmp/checksums.txt https://github.com/benbjohnson/litestream/releases/download/v0.5.18/checksums.txt
          grep " $litestream_asset\$" /tmp/checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/$litestream_asset" -C /usr/local/bin litestream
          litestream version
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: bun run test:e2e
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t overture:ci .
      - name: Start the container and check the health route
        run: |
          set -euo pipefail
          docker run -d --name overture-ci \
            -e LITESTREAM_ENABLED=false \
            -e ENABLE_TEST_ROUTES=false \
            -e GOOGLE_CLIENT_ID=e2e-google-client-id \
            -e GOOGLE_CLIENT_SECRET=e2e-google-client-secret \
            -e LINKEDIN_CLIENT_ID=e2e-linkedin-client-id \
            -e LINKEDIN_CLIENT_SECRET=e2e-linkedin-client-secret \
            -e OWNER_EMAIL=maya.okafor@example.com \
            -e TURNSTILE_SECRET=1x0000000000000000000000000000000AA \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            -p 127.0.0.1:3100:3000 \
            overture:ci
          deadline=$(date -u +%s)
          deadline=$((deadline + 60))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            status=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:3100/api/health || true)
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' overture-ci)" != "true" ]; then
              docker logs overture-ci
              exit 1
            fi
            sleep 2
          done
          docker logs overture-ci
          exit 1
      - run: docker logs overture-ci
        if: always()
      - run: docker rm -f overture-ci
        if: always()

  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun (oven-sh/setup-bun v2 @ 0c5077e)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Litestream
        run: |
          litestream_asset=litestream-0.5.18-linux-x86_64.tar.gz
          curl -fsSLo "/tmp/$litestream_asset" "https://github.com/benbjohnson/litestream/releases/download/v0.5.18/$litestream_asset"
          curl -fsSLo /tmp/checksums.txt https://github.com/benbjohnson/litestream/releases/download/v0.5.18/checksums.txt
          grep " $litestream_asset\$" /tmp/checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf "/tmp/$litestream_asset" -C /usr/local/bin litestream
          litestream version
      - run: bun run scripts/restore-drill.ts local
